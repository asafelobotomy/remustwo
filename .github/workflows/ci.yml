name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang-format-18 \
            qt6-base-dev libqt6sql6-sqlite zlib1g-dev libarchive-dev qt6-declarative-dev

      - name: Refuse copyrighted dumps in git
        run: |
          set -euo pipefail
          if git ls-files -- 'testroms' | grep -vE 'testroms/README.md$'; then
            echo "testroms/ must not contain tracked dumps" >&2
            exit 1
          fi
          if find testdata -type f -size +64k | grep .; then
            echo "testdata/ must stay tiny synthetic vectors" >&2
            exit 1
          fi

      # Pinned to clang-format 18 (ubuntu-24.04 ships 18.1.3); formatting output
      # differs between major versions, so format locally with the same major.
      - name: clang-format
        run: |
          clang-format-18 --version
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -G Ninja -DREMUSTWO_ENABLE_WARNINGS=ON -DCMAKE_BUILD_TYPE=Debug -DREMUSTWO_ENABLE_LIBARCHIVE=ON -DREMUSTWO_BUILD_GUI=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: bash scripts/smoke.sh

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Refuse copyrighted dumps in git
        run: |
          set -euo pipefail
          if git ls-files -- 'testroms' | grep -vE 'testroms/README.md$'; then
            echo "testroms/ must not contain tracked dumps" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev libqt6sql6-sqlite zlib1g-dev libarchive-dev

      - name: Configure ASan
        run: |
          cmake -S . -B build -G Ninja -DREMUSTWO_ENABLE_WARNINGS=ON \
            -DREMUSTWO_ENABLE_LIBARCHIVE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build and test
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: CLI help
        run: ./build/remustwo --help
